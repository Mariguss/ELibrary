{% extends "base.html" %}
{% block title %}Главная — АИС «Электронная библиотека»{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Книги</h2>
    <div class="d-flex gap-2">
        <select id="genre-filter" class="form-select" style="width: auto;">
            <option value="">Все жанры</option>
        </select>
    </div>
</div>

<div id="book-list" class="row g-3"></div>

<nav class="mt-4">
    <ul class="pagination justify-content-center" id="pagination"></ul>
</nav>

<div class="text-center mb-5">
    <a href="/book/add" class="btn btn-success admin-only d-none">Добавить книгу</a>
</div>

<!-- Модальное окно удаления -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Удаление книги</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Вы уверены, что хотите удалить книгу «<span id="delete-book-title"></span>»?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Нет</button>
                <button type="button" class="btn btn-danger" id="confirm-delete-btn">Да</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
const PAGE_SIZE = 10;
let currentPage = 1;
let currentGenre = "";
let deleteBookId = null;

const RATING_LABELS = {5: "отлично", 4: "хорошо", 3: "удовлетворительно", 2: "неудовлетворительно", 1: "плохо", 0: "ужасно"};

async function loadGenres() {
    const resp = await fetch("/api/v1/genre");
    if (!resp.ok) return;
    const data = await resp.json();
    const select = document.getElementById("genre-filter");
    for (const genre of data.founds) {
        const opt = document.createElement("option");
        opt.value = genre.id;
        opt.textContent = genre.name;
        select.appendChild(opt);
    }
}

function bookCard(book) {
    const user = getUser();
    const genres = book.genres.map(g => `<span class="badge bg-secondary me-1">${g.name}</span>`).join("");
    const rating = book.avg_rating != null ? book.avg_rating.toFixed(2) : "—";
    const cover = book.cover_url || "https://via.placeholder.com/150x220?text=No+Cover";

    let buttons = `<a href="/book/${book.id}" class="btn btn-sm btn-outline-primary">Просмотр</a>`;
    if (user && (user.role.name === "admin" || user.role.name === "moderator")) {
        buttons += ` <a href="/book/${book.id}/edit" class="btn btn-sm btn-outline-secondary">Редактировать</a>`;
    }
    if (user && user.role.name === "admin") {
        buttons += ` <button class="btn btn-sm btn-outline-danger" onclick="openDeleteModal(${book.id}, '${book.title.replace(/'/g, "\\'")}')">Удалить</button>`;
    }

    return `
    <div class="col-md-6 col-lg-4">
        <div class="card h-100">
            <img src="${cover}" class="card-img-top" style="height: 220px; object-fit: cover;" alt="Обложка">
            <div class="card-body">
                <h5 class="card-title">${book.title}</h5>
                <p class="mb-1">${genres}</p>
                <p class="mb-1 text-muted">${book.year} год</p>
                <p class="mb-1">Рейтинг: ${rating} (${book.comments_count} рец.)</p>
            </div>
            <div class="card-footer d-flex gap-2">${buttons}</div>
        </div>
    </div>`;
}

async function loadBooks() {
    let url = `/api/v1/book?page=${currentPage}&page_size=${PAGE_SIZE}`;
    if (currentGenre) url += `&genre_id=${currentGenre}`;

    const resp = await fetch(url);
    const data = await resp.json();

    const list = document.getElementById("book-list");
    list.innerHTML = data.founds.map(bookCard).join("") || "<p class='text-muted'>Книги не найдены.</p>";

    renderPagination(data.search_options);
    renderNavbar();
}

function renderPagination(opts) {
    const totalPages = Math.ceil(opts.total_count / opts.page_size);
    const pagination = document.getElementById("pagination");
    pagination.innerHTML = "";

    for (let i = 1; i <= totalPages; i++) {
        const li = document.createElement("li");
        li.className = `page-item ${i === currentPage ? "active" : ""}`;
        li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
        li.addEventListener("click", (e) => {
            e.preventDefault();
            currentPage = i;
            loadBooks();
        });
        pagination.appendChild(li);
    }
}

function openDeleteModal(bookId, title) {
    deleteBookId = bookId;
    document.getElementById("delete-book-title").textContent = title;
    new bootstrap.Modal(document.getElementById("deleteModal")).show();
}

document.getElementById("confirm-delete-btn").addEventListener("click", async () => {
    const resp = await apiFetch(`/api/v1/book/${deleteBookId}`, { method: "DELETE" });
    bootstrap.Modal.getInstance(document.getElementById("deleteModal")).hide();
    if (resp.ok) {
        redirectWithFlash("/", "Книга успешно удалена");
    } else {
        redirectWithFlash("/", "Произошла ошибка при удалении книги", "danger");
    }
});

document.getElementById("genre-filter").addEventListener("change", (e) => {
    currentGenre = e.target.value;
    currentPage = 1;
    loadBooks();
});

loadGenres();
loadBooks();
</script>
{% endblock %}
