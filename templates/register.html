{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4">Регистрация</h2>

        <div id="form-error" class="alert alert-danger d-none"></div>

        <form id="register-form">
            <div class="mb-3">
                <label for="last_name" class="form-label">Фамилия</label>
                <input type="text" class="form-control" id="last_name" required minlength="2" maxlength="100">
            </div>
            <div class="mb-3">
                <label for="first_name" class="form-label">Имя</label>
                <input type="text" class="form-control" id="first_name" required minlength="2" maxlength="100">
            </div>
            <div class="mb-3">
                <label for="middle_name" class="form-label">Отчество</label>
                <input type="text" class="form-control" id="middle_name" maxlength="100">
            </div>
            <div class="mb-3">
                <label for="login" class="form-label">Логин</label>
                <input type="text" class="form-control" id="login" required minlength="3" maxlength="50">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
        </form>

        <p class="mt-3 text-center">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("form-error");
    errorBox.classList.add("d-none");

    const body = {
        login: document.getElementById("login").value,
        password: document.getElementById("password").value,
        first_name: document.getElementById("first_name").value,
        last_name: document.getElementById("last_name").value,
        middle_name: document.getElementById("middle_name").value,
    };

    const resp = await fetch("/api/v1/auth/sign-up", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
    });

    if (!resp.ok) {
        const err = await resp.json().catch(() => null);
        errorBox.textContent = (err && err.detail) ? err.detail : "Не удалось зарегистрироваться. Проверьте корректность введённых данных.";
        errorBox.classList.remove("d-none");
        return;
    }

    redirectWithFlash("/login", "Регистрация прошла успешно. Войдите в систему.");
});
</script>
{% endblock %}
