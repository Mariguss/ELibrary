{% extends "base.html" %}
{% block title %}Книга — АИС «Электронная библиотека»{% endblock %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
{% endblock %}

{% block content %}
<div id="book-container" class="row"></div>

<hr class="my-4">

<h4>Рецензии</h4>
<div id="comments-container"></div>

<div id="review-action" class="mt-3"></div>

<!-- Модальное окно "Добавить в подборку" -->
<div class="modal fade" id="selectionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Добавить в подборку</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <select id="selection-select" class="form-select"></select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" id="confirm-add-to-selection-btn">Добавить</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const BOOK_ID = {{ book_id }};
const RATING_LABELS = {5: "5 — отлично", 4: "4 — хорошо", 3: "3 — удовлетворительно", 2: "2 — неудовлетворительно", 1: "1 — плохо", 0: "0 — ужасно"};

function fio(user) {
    return `${user.last_name} ${user.first_name} ${user.middle_name || ""}`.trim();
}

async function loadBook() {
    const resp = await fetch(`/api/v1/book/${BOOK_ID}`);
    if (!resp.ok) {
        document.getElementById("book-container").innerHTML = "<p class='text-danger'>Книга не найдена.</p>";
        return;
    }
    const book = await resp.json();
    const user = getUser();

    const cover = book.cover_url || "https://via.placeholder.com/300x440?text=No+Cover";
    const genres = book.genres.map(g => `<span class="badge bg-secondary me-1">${g.name}</span>`).join("");
    const rating = book.avg_rating != null ? book.avg_rating.toFixed(2) : "—";
    const descriptionHtml = marked.parse(book.description || "");

    let buttons = "";
    if (user && (user.role.name === "admin" || user.role.name === "moderator")) {
        buttons += `<a href="/book/${book.id}/edit" class="btn btn-outline-secondary me-2">Редактировать</a>`;
    }
    if (user && user.role.name === "admin") {
        buttons += `<button class="btn btn-outline-danger me-2" onclick="openDeleteModal()">Удалить</button>`;
    }
    if (user && user.role.name === "user") {
        buttons += `<button class="btn btn-outline-primary" onclick="openSelectionModal()">Добавить в подборку</button>`;
    }

    document.getElementById("book-container").innerHTML = `
        <div class="col-md-4">
            <img src="${cover}" class="img-fluid rounded" alt="Обложка">
        </div>
        <div class="col-md-8">
            <h2>${book.title}</h2>
            <p class="mb-1">${genres}</p>
            <p class="text-muted mb-1">${book.author}, ${book.publisher}, ${book.year} г., ${book.volume || "—"} стр.</p>
            <p class="mb-3">Рейтинг: <strong>${rating}</strong> (${book.comments_count} рецензий)</p>
            <div class="mb-3">${descriptionHtml}</div>
            <div>${buttons}</div>
        </div>
    `;

    renderNavbar();
}

async function loadComments() {
    const resp = await fetch(`/api/v1/book/${BOOK_ID}/comment`);
    const comments = await resp.json();

    const container = document.getElementById("comments-container");
    if (comments.length === 0) {
        container.innerHTML = "<p class='text-muted'>Пока нет рецензий.</p>";
    } else {
        container.innerHTML = comments.map(c => `
            <div class="card mb-2">
                <div class="card-body">
                    <h6 class="card-subtitle mb-1">${fio(c.user)} — оценка: ${c.scale}</h6>
                    <small class="text-muted">${new Date(c.created_at).toLocaleString("ru-RU")}</small>
                    <div class="mt-2">${marked.parse(c.text)}</div>
                </div>
            </div>
        `).join("");
    }

    await renderReviewAction();
}

async function renderReviewAction() {
    const user = getUser();
    const actionContainer = document.getElementById("review-action");

    if (!user || !["user", "moderator", "admin"].includes(user.role.name)) {
        actionContainer.innerHTML = "";
        return;
    }

    const resp = await apiFetch(`/api/v1/book/${BOOK_ID}/comment/me`);
    const myComment = resp.ok ? await resp.json() : null;

    if (myComment) {
        actionContainer.innerHTML = `
            <div class="card border-primary">
                <div class="card-body">
                    <h6 class="card-subtitle mb-1">Ваша рецензия — оценка: ${myComment.scale}</h6>
                    <div class="mt-2">${marked.parse(myComment.text)}</div>
                </div>
            </div>`;
    } else {
        actionContainer.innerHTML = `<a href="/book/${BOOK_ID}/review" class="btn btn-primary">Написать рецензию</a>`;
    }
}

async function loadSelectionsForModal() {
    const resp = await apiFetch("/api/v1/selection");
    if (!resp.ok) return;
    const selections = await resp.json();
    const select = document.getElementById("selection-select");
    select.innerHTML = selections.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
}

function openSelectionModal() {
    loadSelectionsForModal();
    new bootstrap.Modal(document.getElementById("selectionModal")).show();
}

document.getElementById("confirm-add-to-selection-btn").addEventListener("click", async () => {
    const selectionId = document.getElementById("selection-select").value;
    const resp = await apiFetch(`/api/v1/selection/${selectionId}/book`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ book_id: BOOK_ID }),
    });
    bootstrap.Modal.getInstance(document.getElementById("selectionModal")).hide();

    if (resp.ok) {
        redirectWithFlash(`/book/${BOOK_ID}`, "Книга успешно добавлена в подборку");
    } else {
        const err = await resp.json();
        redirectWithFlash(`/book/${BOOK_ID}`, err.detail || "Ошибка при добавлении в подборку", "danger");
    }
});

function openDeleteModal() {
    if (!confirm("Вы уверены, что хотите удалить эту книгу?")) return;
    apiFetch(`/api/v1/book/${BOOK_ID}`, { method: "DELETE" }).then(resp => {
        if (resp.ok) {
            redirectWithFlash("/", "Книга успешно удалена");
        } else {
            redirectWithFlash(`/book/${BOOK_ID}`, "Ошибка при удалении книги", "danger");
        }
    });
}

loadBook();
loadComments();
</script>
{% endblock %}
