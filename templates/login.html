{% extends "base.html" %}
{% block title %}Вход — АИС «Электронная библиотека»{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4">Вход</h2>
        <div id="login-error" class="alert alert-danger d-none"></div>
        <form id="login-form">
            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input type="text" class="form-control" id="login" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember" checked>
                <label class="form-check-label" for="remember">Запомнить меня</label>
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>
        <p class="mt-3 text-center">
            Нет аккаунта? <a href="/register">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const login = document.getElementById("login").value;
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("login-error");
    errorBox.classList.add("d-none");

    const resp = await fetch("/api/v1/auth/sign-in", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ login, password }),
    });

    if (!resp.ok) {
        errorBox.textContent = "Невозможно аутентифицироваться с указанными логином и паролем";
        errorBox.classList.remove("d-none");
        return;
    }

    const data = await resp.json();
    const remember = document.getElementById("remember").checked;
    setAuth(data.access_token, data.user_info, remember);

    const params = new URLSearchParams(window.location.search);
    const next = params.get("next") || "/";
    window.location.href = next;
});
</script>
{% endblock %}
