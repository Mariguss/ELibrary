{% extends "base.html" %}
{% block title %}Личный кабинет — Elibrary{% endblock %}

{% block content %}
<h4 class="mb-4 fw-bold"><i class="bi bi-person-circle me-2"></i>Личный кабинет</h4>

<!-- Profile card -->
<div class="card mb-4">
  <div class="card-body d-flex align-items-center gap-4 flex-wrap">
    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
         style="width:72px;height:72px;font-size:2rem;flex-shrink:0">
      <i class="bi bi-person-fill"></i>
    </div>
    <div class="flex-grow-1">
      <h5 class="mb-0 fw-bold" id="prof-login">—</h5>
      <small class="text-muted" id="prof-email"></small>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#editModal">
        <i class="bi bi-pencil me-1"></i>Изменить
      </button>
      <a href="/login" class="btn btn-outline-secondary btn-sm" onclick="logout();return false;">
        <i class="bi bi-box-arrow-right me-1"></i>Выйти
      </a>
      <button class="btn btn-outline-danger btn-sm" onclick="confirmDelete()">
        <i class="bi bi-trash me-1"></i>Удалить аккаунт
      </button>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Редактировать профиль</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Имя</label>
          <input id="edit-first-name" type="text" class="form-control"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Фамилия</label>
          <input id="edit-last-name" type="text" class="form-control"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Новый пароль (оставьте пустым, чтобы не менять)</label>
          <input id="edit-password" type="password" class="form-control"/>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const user = getUser();
if (!user) window.location.href = '/login';

let selectedSkillId = null;

async function loadProfile() {
  document.getElementById('prof-login').textContent = user.login || '';
  document.getElementById('edit-first-name').value = user.first_name || '';
  document.getElementById('edit-middle-name').value = user.middle_name || '';
  document.getElementById('edit-last-name').value = user.last_name || '';

}

async function loadSkills() {
  const res = await apiFetch('/me/skills');
  if (!res || !res.ok) return;
  const skills = await res.json();
  const el = document.getElementById('skills-list');
  if (!skills.length) {
    el.innerHTML = '<span class="text-muted small">Навыки не добавлены</span>';
    return;
  }
  el.innerHTML = skills.map(s => `
    <span class="badge bg-primary skill-badge d-flex align-items-center gap-1">
      ${escHtml(s.name)}
      <button class="btn-close btn-close-white" style="font-size:.6rem" onclick="removeSkill(${s.id})"></button>
    </span>`).join('');
}

async function removeSkill(skillId) {
  const res = await apiFetch(`/me/skills/${skillId}`, { method: 'DELETE' });
  if (res && (res.ok || res.status === 204)) { showToast('Навык удалён'); loadSkills(); }
}

let skillTimer = null;
function searchSkills() {
  clearTimeout(skillTimer);
  skillTimer = setTimeout(async () => {
    const q = document.getElementById('skill-search').value.trim();
    if (!q) { document.getElementById('skill-suggestions').innerHTML = ''; return; }
    const res = await apiFetch(`/skill?page_size=200&ordering=name`);
    if (!res || !res.ok) return;
    const data = await res.json();
    const filtered = (data.founds||[]).filter(s => s.name.toLowerCase().includes(q.toLowerCase()));
    const el = document.getElementById('skill-suggestions');
    if (!filtered.length) { el.innerHTML = '<div class="list-group-item small text-muted">Не найдено</div>'; return; }
    el.innerHTML = filtered.map(s =>
      `<button class="list-group-item list-group-item-action small" onclick="selectSkill(${s.id},'${escHtml(s.name)}')">
        ${escHtml(s.name)} <span class="text-muted">${s.category||''}</span>
       </button>`).join('');
  }, 300);
}

function selectSkill(id, name) {
  selectedSkillId = id;
  document.getElementById('skill-search').value = name;
  document.getElementById('skill-suggestions').innerHTML = '';
}

async function addSkillBySearch() {
  if (!selectedSkillId) { showToast('Выберите навык из списка', 'warning'); return; }
  const res = await apiFetch('/me/skills', {
    method: 'POST',
    body: JSON.stringify({ skill_id: selectedSkillId })
  });
  if (res && (res.ok || res.status === 201)) {
    showToast('Навык добавлен');
    selectedSkillId = null;
    document.getElementById('skill-search').value = '';
    loadSkills();
  } else {
    const d = await res.json();
    showToast(d.detail || 'Ошибка', 'danger');
  }
}

async function saveProfile() {
  const firstName = document.getElementById('edit-first-name').value.trim();
  const lastName = document.getElementById('edit-last-name').value.trim();
  const middleName = document.getElementById('edit-middle-name').value.trim();
  const password = document.getElementById('edit-password').value;
  const body = { first_name: firstName, last_name: lastName, middle_name: middleName };
  if (password) body.password = password;
  const res = await apiFetch(`/user/${user.id}`, { method: 'PATCH', body: JSON.stringify(body) });
  if (res && res.ok) {
    const updated = await res.json();
    localStorage.setItem('user', JSON.stringify({ ...user, ...updated }));
    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
    showToast('Профиль обновлён');
    loadProfile();
  } else {
    showToast('Ошибка при сохранении', 'danger');
  }
}

async function confirmDelete() {
  if (!confirm('Удалить аккаунт? Это действие необратимо.')) return;
  const res = await apiFetch(`/user/${user.id}`, { method: 'DELETE' });
  if (res && (res.ok || res.status === 204)) {
    logout();
  }
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadProfile();
</script>
{% endblock %}
