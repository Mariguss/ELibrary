{% extends "base.html" %}
{% block title %}Администрирование — SkillNavigator{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
  <h4 class="fw-bold mb-0"><i class="bi bi-shield-lock me-2 text-danger"></i>Панель администратора</h4>
</div>

<!-- Tabs -->
<ul class="nav nav-tabs mb-4" id="adminTabs">
  <li class="nav-item">
    <button class="nav-link active" onclick="switchTab('users',this)">
      <i class="bi bi-people me-1"></i>Пользователи
    </button>
  </li>
</ul>

<!-- Users -->
<div id="tab-users">
  <div class="d-flex gap-2 mb-3 flex-wrap">
    <input id="u-search" class="form-control form-control-sm" style="max-width:300px" placeholder="Поиск по логину" oninput="loadUsers()"/>
    <button class="btn btn-success btn-sm ms-auto" onclick="openUserCreate()">
      <i class="bi bi-plus-lg me-1"></i>Создать пользователя
    </button>
  </div>
  <div class="table-responsive">
    <table class="table table-hover table-sm align-middle">
      <thead class="table-light">
        <tr><th>#</th><th>Логин</th><th>ФИО</th><th>Роль</th><th>Создан</th><th></th></tr>
      </thead>
      <tbody id="users-tbody"></tbody>
    </table>
  </div>
  <div id="users-pagination" class="d-flex gap-2 mt-2"></div>
</div>

<!-- Universal edit modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Редактировать</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-delete-btn" class="btn btn-danger me-auto d-none" onclick="modalDelete()">Удалить</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary" onclick="modalSave()">Сохранить</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const user = getUser();
if (!user || !user.is_superuser) window.location.href = '/';

let activeTab = 'users';
let modalContext = {};   // { type, id, method, url, fields }
const modal = new bootstrap.Modal(document.getElementById('editModal'));

/* ── tabs ───────────────────────────────────────────── */
function switchTab(name, btn) {
  document.querySelectorAll('#adminTabs .nav-link').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['users','vacancies','companies','skills'].forEach(t =>
    document.getElementById('tab-'+t).style.display = t===name?'':'none');
  activeTab = name;
  if (name==='users') loadUsers();
  else if (name==='vacancies') loadAdminVacancies();
  else if (name==='companies') loadCompanies();
  else if (name==='skills') loadSkills();
}

/* ── pagination helper ───────────────────────────────── */
function mkPagination(opts, currentPage, loadFn, elId) {
  const el = document.getElementById(elId);
  if (!opts || opts.total_count <= opts.page_size) { el.innerHTML=''; return; }
  const pages = Math.ceil(opts.total_count / opts.page_size);
  el.innerHTML = Array.from({length:pages},(_,i)=>i+1).map(i=>
    `<button class="btn btn-sm ${i===currentPage?'btn-primary':'btn-outline-secondary'}" onclick="${loadFn}(${i})">${i}</button>`
  ).join('');
}

/* ── users ───────────────────────────────────────────── */
let uPage = 1;
async function loadUsers(page=1) {
  uPage = page;
  const q = document.getElementById('u-search').value.trim();
  let params = `page=${page}&page_size=15&ordering=-id`;
  if (q) params += `&login__eq=${encodeURIComponent(q)}`;
  const res = await apiFetch(`/user?${params}`);
  if (!res || !res.ok) return;
  const d = await res.json();
  const tbody = document.getElementById('users-tbody');
  tbody.innerHTML = (d.founds||[]).map(u => `
    <tr>
      <td class="text-muted">${u.id}</td>
      <td>${escHtml(u.login)}</td>
      <td>${escHtml(u.fio())}</td>
      <td>${escHtml(u.role.name)}</td>
      <td class="text-muted small">${new Date(u.created_at).toLocaleDateString('ru')}</td>
      <td>
        <button class="btn btn-sm btn-outline-primary" onclick="editUser(${u.id},'${escHtml(u.login)}','${escHtml(u.email||'')}',${u.is_superuser})">
          <i class="bi bi-pencil"></i>
        </button>
        <button class="btn btn-sm btn-outline-danger ms-1" onclick="deleteUser(${u.id},'${escHtml(u.login)}')">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>`).join('');
  mkPagination(d.search_options, uPage, 'loadUsers', 'users-pagination');
}

function openUserCreate() {
  document.getElementById('modal-title').textContent = 'Новый пользователь';
  document.getElementById('modal-body').innerHTML = `
    <div class="mb-3"><label class="form-label">Логин</label><input id="f-login" class="form-control"/></div>
    <div class="mb-3"><label class="form-label">Email</label><input id="f-email" type="email" class="form-control"/></div>
    <div class="mb-3"><label class="form-label">Пароль</label><input id="f-password" type="password" class="form-control"/></div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="f-super"/>
      <label class="form-check-label">Администратор</label>
    </div>`;
  document.getElementById('modal-delete-btn').className = 'btn btn-danger me-auto d-none';
  modalContext = { save: async () => {
    const body = {
      login: document.getElementById('f-login').value,
      email: document.getElementById('f-email').value,
      password: document.getElementById('f-password').value,
      is_superuser: document.getElementById('f-super').checked,
    };
    const r = await apiFetch('/user', { method:'POST', body:JSON.stringify(body) });
    if (r && r.ok) { modal.hide(); showToast('Пользователь создан'); loadUsers(); }
    else {
      const d = r ? await r.json() : {};
      showToast(d.detail || 'Ошибка', 'danger');
    }
  }};
  modal.show();
}

function editUser(id, login, email, isSuperuser) {
  document.getElementById('modal-title').textContent = `Пользователь #${id}: ${login}`;
  document.getElementById('modal-body').innerHTML = `
    <input type="hidden" id="f-id" value="${id}"/>
    <div class="mb-3"><label class="form-label">Email</label>
      <input id="f-email" class="form-control" value="${escHtml(email)}"/></div>
    <div class="mb-3"><label class="form-label">Новый пароль (оставьте пустым, чтобы не менять)</label>
      <input id="f-password" type="password" class="form-control"/></div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="f-super" ${isSuperuser?'checked':''}/>
      <label class="form-check-label">Администратор</label>
    </div>`;
  document.getElementById('modal-delete-btn').className = 'btn btn-danger me-auto d-none';
  modalContext = {
    type:'user', id,
    save: async () => {
      const body = { email: document.getElementById('f-email').value, is_superuser: document.getElementById('f-super').checked };
      const pw = document.getElementById('f-password').value;
      if (pw) body.password = pw;
      const r = await apiFetch(`/user/${id}`, { method:'PATCH', body:JSON.stringify(body) });
      if (r&&r.ok) { modal.hide(); showToast('Сохранено'); loadUsers(uPage); }
      else showToast('Ошибка', 'danger');
    }
  };
  modal.show();
}

async function deleteUser(id, login) {
  if (!confirm(`Удалить пользователя "${login}"?`)) return;
  const r = await apiFetch(`/user/${id}`, { method:'DELETE' });
  if (r && (r.ok||r.status===204)) { showToast('Пользователь удалён','warning'); loadUsers(uPage); }
  else { const d = r ? await r.json() : {}; showToast(d.detail || 'Ошибка', 'danger'); }
}

loadUsers();
</script>
{% endblock %}
