{% macro render_book_fields(show_cover=False) %}
<div class="mb-3">
    <label class="form-label">Название</label>
    <input type="text" class="form-control" id="title" required>
</div>

<div class="mb-3">
    <label class="form-label">Краткое описание (Markdown)</label>
    <textarea class="form-control" id="description" rows="6"></textarea>
</div>

<div class="row">
    <div class="col-md-4 mb-3">
        <label class="form-label">Год</label>
        <input type="number" class="form-control" id="year" required min="1000" max="2100">
    </div>
    <div class="col-md-4 mb-3">
        <label class="form-label">Издательство</label>
        <input type="text" class="form-control" id="publisher" required>
    </div>
    <div class="col-md-4 mb-3">
        <label class="form-label">Объём (страниц)</label>
        <input type="number" class="form-control" id="volume" required min="1">
    </div>
</div>

<div class="mb-3">
    <label class="form-label">Автор</label>
    <input type="text" class="form-control" id="author" required>
</div>

<div class="mb-3">
    <label class="form-label">Жанры</label>
    <div id="genre_ids" class="border rounded p-2" style="max-height: 200px; overflow-y: auto;"></div>
</div>

{% if show_cover %}
<div class="mb-3">
    <label class="form-label">Обложка</label>
    <input type="file" class="form-control" id="cover" accept="image/*" required>
</div>
{% endif %}
{% endmacro %}
